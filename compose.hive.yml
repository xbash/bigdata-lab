services:
  sql-ui:
    build:
      context: .
      dockerfile: containers/sql-ui/Containerfile
      args:
        HUE_UPSTREAM_IMAGE: "${HUE_UPSTREAM_IMAGE:-gethue/hue:latest}"
    image: bigdata-sql-ui:${BIGDATA_IMAGE_TAG}
    container_name: bigdata-sql-ui
    hostname: sql-ui
    environment:
      TZ: America/Santiago
    volumes:
      - ./conf/hue:/opt/bigdata/conf/hue:ro,z
      - ./data/hue:/opt/bigdata/data/hue:z
    networks:
      bigdata-lab-net:
        aliases:
          - sql-ui
          - hue
    ports:
      - "8888:8888"
    mem_limit: 1024m
    cpus: 1.0

  hive-metastore:
    image: apache/hive:${HIVE_METASTORE_IMAGE_TAG:-standalone-metastore-4.2.0}
    container_name: bigdata-hive-metastore
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      TZ: America/Santiago
    ports:
      - "9083:9083"
    volumes:
      - ./conf/hive:/hive_custom_conf:ro,z
      - ./data/hive/warehouse:/opt/hive/data/warehouse:z
    networks:
      bigdata-lab-net:
        aliases:
          - hive-metastore

  hive-server2:
    image: apache/hive:${HIVE_SERVER_IMAGE_TAG:-4.2.0}
    container_name: bigdata-hive-server
    hostname: hive-server2
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      TZ: America/Santiago
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./conf/hive:/hive_custom_conf:ro,z
      - ./data/hive/warehouse:/opt/hive/data/warehouse:z
    networks:
      bigdata-lab-net:
        aliases:
          - hive-server2
